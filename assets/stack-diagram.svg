<svg viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg" font-family="'Fira Code', 'JetBrains Mono', monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05130c"/>
      <stop offset="100%" stop-color="#0d2818"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#39d97a"/>
    </marker>
  </defs>

  <rect width="1200" height="340" rx="14" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="338" rx="13" fill="none" stroke="#1a8f4c" stroke-opacity="0.35"/>

  <text x="20" y="28" font-size="13" fill="#7fbf98">$ cat system.stack</text>

  <!-- connecting arrows (animated flow) -->
  <g stroke="#39d97a" stroke-width="2" stroke-dasharray="6 6">
    <line x1="220" y1="110" x2="260" y2="110" marker-end="url(#arrow)">
      <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.2s" repeatCount="indefinite"/>
    </line>
    <line x1="460" y1="110" x2="500" y2="110" marker-end="url(#arrow)">
      <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.2s" repeatCount="indefinite"/>
    </line>
    <line x1="700" y1="110" x2="740" y2="110" marker-end="url(#arrow)">
      <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.2s" repeatCount="indefinite"/>
    </line>
    <line x1="940" y1="110" x2="980" y2="110" marker-end="url(#arrow)">
      <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.2s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- node template repeated -->
  <g>
    <!-- Languages -->
    <rect x="20" y="40" width="200" height="140" rx="10" fill="#0f2e1c" stroke="#39d97a" stroke-opacity="0.5"/>
    <text x="120" y="64" text-anchor="middle" font-size="14" fill="#5fe38c" font-weight="bold">languages</text>
    <text x="120" y="90" text-anchor="middle" font-size="12" fill="#e8f5ec">Java · Python</text>
    <text x="120" y="108" text-anchor="middle" font-size="12" fill="#e8f5ec">C++ · Go</text>
    <text x="120" y="126" text-anchor="middle" font-size="12" fill="#e8f5ec">JavaScript</text>
    <text x="120" y="144" text-anchor="middle" font-size="12" fill="#e8f5ec">TypeScript</text>

    <!-- Frontend -->
    <rect x="260" y="40" width="200" height="140" rx="10" fill="#0f2e1c" stroke="#39d97a" stroke-opacity="0.5"/>
    <text x="360" y="64" text-anchor="middle" font-size="14" fill="#5fe38c" font-weight="bold">frontend</text>
    <text x="360" y="90" text-anchor="middle" font-size="12" fill="#e8f5ec">React · Redux</text>
    <text x="360" y="108" text-anchor="middle" font-size="12" fill="#e8f5ec">HTML · CSS</text>
    <text x="360" y="126" text-anchor="middle" font-size="12" fill="#e8f5ec">Bootstrap</text>
    <text x="360" y="144" text-anchor="middle" font-size="12" fill="#e8f5ec">Material UI</text>

    <!-- Backend -->
    <rect x="500" y="40" width="200" height="140" rx="10" fill="#0f2e1c" stroke="#39d97a" stroke-opacity="0.5"/>
    <text x="600" y="64" text-anchor="middle" font-size="14" fill="#5fe38c" font-weight="bold">backend</text>
    <text x="600" y="90" text-anchor="middle" font-size="12" fill="#e8f5ec">Node.js</text>
    <text x="600" y="108" text-anchor="middle" font-size="12" fill="#e8f5ec">Express</text>
    <text x="600" y="126" text-anchor="middle" font-size="12" fill="#e8f5ec">Spring Boot</text>
    <text x="600" y="144" text-anchor="middle" font-size="12" fill="#e8f5ec">FastAPI · Django</text>

    <!-- Data -->
    <rect x="740" y="40" width="200" height="140" rx="10" fill="#0f2e1c" stroke="#39d97a" stroke-opacity="0.5"/>
    <text x="840" y="64" text-anchor="middle" font-size="14" fill="#5fe38c" font-weight="bold">data</text>
    <text x="840" y="90" text-anchor="middle" font-size="12" fill="#e8f5ec">MySQL</text>
    <text x="840" y="108" text-anchor="middle" font-size="12" fill="#e8f5ec">MongoDB</text>

    <!-- Infra -->
    <rect x="980" y="40" width="200" height="140" rx="10" fill="#0f2e1c" stroke="#39d97a" stroke-opacity="0.5"/>
    <text x="1080" y="64" text-anchor="middle" font-size="14" fill="#5fe38c" font-weight="bold">infra</text>
    <text x="1080" y="90" text-anchor="middle" font-size="12" fill="#e8f5ec">AWS · GCP</text>
    <text x="1080" y="108" text-anchor="middle" font-size="12" fill="#e8f5ec">Docker</text>
    <text x="1080" y="126" text-anchor="middle" font-size="12" fill="#e8f5ec">GitHub Actions</text>
  </g>

  <!-- tooling cross-cutting bar -->
  <rect x="20" y="210" width="1160" height="46" rx="10" fill="#123a24" stroke="#39d97a" stroke-opacity="0.3"/>
  <text x="600" y="238" text-anchor="middle" font-size="13" fill="#9fe8b8">
    cross-cutting/tooling → Git · Figma · Unity · VS Code · Linux
  </text>

  <text x="20" y="300" font-size="12" fill="#5c7c6b">// data flows left to right: language choice through to deployed infra</text>
</svg>
