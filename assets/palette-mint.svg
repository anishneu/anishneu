<svg viewBox="0 0 1000 150" xmlns="http://www.w3.org/2000/svg" font-family="'Fira Code', 'JetBrains Mono', ui-monospace, monospace">
  <defs>
    <clipPath id="clip"><rect x="0" y="0" width="1000" height="150" rx="14"/></clipPath>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1000" height="150" fill="#0e1512"/>
    <text x="28" y="34" font-size="13" letter-spacing="5" fill="#6ee7c7" font-weight="700">MINT&#160;NOCTURNE</text>
    <text x="28" y="52" font-size="10.5" fill="#7fa99d">a hand-rolled palette &#183; cool, low-glare, mint-forward</text>

    <g transform="translate(28,76)">
      <g transform="translate(0,0)"><rect width="96" height="48" rx="10" fill="#0e1512" stroke="#2b3a35"/><text x="48" y="66" text-anchor="middle" font-size="10" fill="#dcefe9">#0e1512</text><text x="48" y="-8" text-anchor="middle" font-size="9" fill="#7fa99d">void</text></g>
      <g transform="translate(108,0)"><rect width="96" height="48" rx="10" fill="#15201c" stroke="#2b3a35"/><text x="48" y="66" text-anchor="middle" font-size="10" fill="#dcefe9">#15201c</text><text x="48" y="-8" text-anchor="middle" font-size="9" fill="#7fa99d">panel</text></g>
      <g transform="translate(216,0)"><rect width="96" height="48" rx="10" fill="#0f766e"/><text x="48" y="66" text-anchor="middle" font-size="10" fill="#dcefe9">#0f766e</text><text x="48" y="-8" text-anchor="middle" font-size="9" fill="#7fa99d">deep&#160;sea</text></g>
      <g transform="translate(324,0)"><rect width="96" height="48" rx="10" fill="#2dd4bf"/><text x="48" y="66" text-anchor="middle" font-size="10" fill="#dcefe9">#2dd4bf</text><text x="48" y="-8" text-anchor="middle" font-size="9" fill="#7fa99d">teal</text></g>
      <g transform="translate(432,0)"><rect width="96" height="48" rx="10" fill="#6ee7c7"/><text x="48" y="66" text-anchor="middle" font-size="10" fill="#dcefe9">#6ee7c7</text><text x="48" y="-8" text-anchor="middle" font-size="9" fill="#7fa99d">mint</text></g>
      <g transform="translate(540,0)"><rect width="96" height="48" rx="10" fill="#8ea2ff"/><text x="48" y="66" text-anchor="middle" font-size="10" fill="#dcefe9">#8ea2ff</text><text x="48" y="-8" text-anchor="middle" font-size="9" fill="#7fa99d">periwinkle</text></g>
      <g transform="translate(648,0)"><rect width="96" height="48" rx="10" fill="#ff9db0"/><text x="48" y="66" text-anchor="middle" font-size="10" fill="#dcefe9">#ff9db0</text><text x="48" y="-8" text-anchor="middle" font-size="9" fill="#7fa99d">coral</text></g>
      <g transform="translate(756,0)"><rect width="96" height="48" rx="10" fill="#e6b17e"/><text x="48" y="66" text-anchor="middle" font-size="10" fill="#dcefe9">#e6b17e</text><text x="48" y="-8" text-anchor="middle" font-size="9" fill="#7fa99d">amber</text></g>
      <g transform="translate(864,0)"><rect width="96" height="48" rx="10" fill="#dcefe9"/><text x="48" y="66" text-anchor="middle" font-size="10" fill="#15201c">#dcefe9</text><text x="48" y="-8" text-anchor="middle" font-size="9" fill="#7fa99d">cloud</text></g>
    </g>

    <rect x="-300" y="0" width="240" height="150" fill="url(#sheen)">
      <animate attributeName="x" values="-300;1000" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="1" y="1" width="998" height="148" rx="13" fill="none" stroke="#2b3a35"/>
  </g>
</svg>
