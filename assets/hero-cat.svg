<svg viewBox="0 0 1000 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Anish Kuila - a mascot cat coding at a laptop with hot coffee on the desk, beside a floating cloud of skill tags">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1512"/>
      <stop offset="60%" stop-color="#101c17"/>
      <stop offset="100%" stop-color="#13241d"/>
    </linearGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0e1512" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#0e1512" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#0e1512" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cdeee5"/>
      <stop offset="100%" stop-color="#6ee7c7"/>
    </linearGradient>
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="rounded"><rect x="0" y="0" width="1000" height="340" rx="20"/></clipPath>
    <clipPath id="screenClip"><rect x="518" y="124" width="164" height="108" rx="4"/></clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="1000" height="340" fill="url(#bg)"/>
    <rect width="1000" height="3" fill="#6ee7c7" opacity="0.35"/>

    <!-- floating skill-tag cloud -->
    <g font-family="'Fira Code', ui-monospace, monospace" font-size="12" font-weight="600" text-anchor="middle">
      <g><rect x="-28" y="-13" width="56" height="26" rx="13" fill="#6ee7c7" fill-opacity="0.14" stroke="#6ee7c7" stroke-opacity="0.55"/><text y="4" fill="#6ee7c7">Java</text>
        <animateTransform attributeName="transform" type="translate" values="740,42; 740,36; 740,42" keyTimes="0;0.5;1" dur="4.2s" calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1" repeatCount="indefinite"/></g>
      <g><rect x="-37" y="-13" width="74" height="26" rx="13" fill="#2dd4bf" fill-opacity="0.14" stroke="#2dd4bf" stroke-opacity="0.55"/><text y="4" fill="#2dd4bf">Python</text>
        <animateTransform attributeName="transform" type="translate" values="846,30; 846,24; 846,30" keyTimes="0;0.5;1" dur="4.8s" calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1" repeatCount="indefinite"/></g>
      <g><rect x="-32" y="-13" width="64" height="26" rx="13" fill="#8ea2ff" fill-opacity="0.14" stroke="#8ea2ff" stroke-opacity="0.55"/><text y="4" fill="#8ea2ff">React</text>
        <animateTransform attributeName="transform" type="translate" values="930,58; 930,52; 930,58" keyTimes="0;0.5;1" dur="5.2s" calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1" repeatCount="indefinite"/></g>
      <g><rect x="-30" y="-13" width="60" height="26" rx="13" fill="#ff9db0" fill-opacity="0.14" stroke="#ff9db0" stroke-opacity="0.55"/><text y="4" fill="#ff9db0">Node</text>
        <animateTransform attributeName="transform" type="translate" values="858,92; 858,86; 858,92" keyTimes="0;0.5;1" dur="4.6s" calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1" repeatCount="indefinite"/></g>
      <g><rect x="-40" y="-13" width="80" height="26" rx="13" fill="#e6b17e" fill-opacity="0.14" stroke="#e6b17e" stroke-opacity="0.55"/><text y="4" fill="#e6b17e">FastAPI</text>
        <animateTransform attributeName="transform" type="translate" values="942,124; 942,118; 942,124" keyTimes="0;0.5;1" dur="5.6s" calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1" repeatCount="indefinite"/></g>
      <g><rect x="-34" y="-13" width="68" height="26" rx="13" fill="#6ee7c7" fill-opacity="0.14" stroke="#6ee7c7" stroke-opacity="0.55"/><text y="4" fill="#6ee7c7">Spring</text>
        <animateTransform attributeName="transform" type="translate" values="872,158; 872,152; 872,158" keyTimes="0;0.5;1" dur="5s" calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1" repeatCount="indefinite"/></g>
      <g><rect x="-27" y="-13" width="54" height="26" rx="13" fill="#2dd4bf" fill-opacity="0.14" stroke="#2dd4bf" stroke-opacity="0.55"/><text y="4" fill="#2dd4bf">AWS</text>
        <animateTransform attributeName="transform" type="translate" values="948,192; 948,186; 948,192" keyTimes="0;0.5;1" dur="4.4s" calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1" repeatCount="indefinite"/></g>
      <g><rect x="-36" y="-13" width="72" height="26" rx="13" fill="#8ea2ff" fill-opacity="0.14" stroke="#8ea2ff" stroke-opacity="0.55"/><text y="4" fill="#8ea2ff">Docker</text>
        <animateTransform attributeName="transform" type="translate" values="864,226; 864,220; 864,226" keyTimes="0;0.5;1" dur="5.4s" calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1" repeatCount="indefinite"/></g>
    </g>

    <!-- floating particles -->
    <g>
      <g><circle cx="120" cy="120" r="2.5" fill="#6ee7c7"><animate attributeName="opacity" values="0;0.6;0" dur="5.5s" begin="-1s" repeatCount="indefinite"/></circle><animateTransform attributeName="transform" type="translate" values="0 0;0 -42" dur="5.5s" begin="-1s" repeatCount="indefinite"/></g>
      <g><circle cx="240" cy="86" r="2" fill="#2dd4bf"><animate attributeName="opacity" values="0;0.6;0" dur="6.2s" begin="-2s" repeatCount="indefinite"/></circle><animateTransform attributeName="transform" type="translate" values="0 0;0 -42" dur="6.2s" begin="-2s" repeatCount="indefinite"/></g>
      <g><circle cx="360" cy="150" r="3" fill="#8ea2ff"><animate attributeName="opacity" values="0;0.55;0" dur="7s" begin="-0.5s" repeatCount="indefinite"/></circle><animateTransform attributeName="transform" type="translate" values="0 0;0 -46" dur="7s" begin="-0.5s" repeatCount="indefinite"/></g>
      <g><circle cx="150" cy="262" r="2" fill="#6ee7c7"><animate attributeName="opacity" values="0;0.6;0" dur="5s" begin="-3s" repeatCount="indefinite"/></circle><animateTransform attributeName="transform" type="translate" values="0 0;0 -40" dur="5s" begin="-3s" repeatCount="indefinite"/></g>
      <g><circle cx="880" cy="120" r="2.5" fill="#2dd4bf"><animate attributeName="opacity" values="0;0.55;0" dur="6.5s" begin="-1.5s" repeatCount="indefinite"/></circle><animateTransform attributeName="transform" type="translate" values="0 0;0 -44" dur="6.5s" begin="-1.5s" repeatCount="indefinite"/></g>
      <g><circle cx="430" cy="104" r="2" fill="#ff9db0"><animate attributeName="opacity" values="0;0.5;0" dur="7.5s" begin="-4s" repeatCount="indefinite"/></circle><animateTransform attributeName="transform" type="translate" values="0 0;0 -44" dur="7.5s" begin="-4s" repeatCount="indefinite"/></g>
      <g><circle cx="820" cy="270" r="2.5" fill="#8ea2ff"><animate attributeName="opacity" values="0;0.5;0" dur="6s" begin="-2.5s" repeatCount="indefinite"/></circle><animateTransform attributeName="transform" type="translate" values="0 0;0 -42" dur="6s" begin="-2.5s" repeatCount="indefinite"/></g>
    </g>

    <!-- desk -->
    <rect x="0" y="252" width="1000" height="88" fill="#0c1310"/>
    <line x1="0" y1="252" x2="1000" y2="252" stroke="#2b3a35" stroke-width="1.5"/>

    <!-- screen glow -->
    <ellipse cx="600" cy="176" rx="150" ry="92" fill="url(#screenGlow)"/>

    <!-- cat body (behind laptop, anchors the tail) -->
    <ellipse cx="650" cy="150" rx="48" ry="34" fill="#cdeee5"/>

    <!-- tail -->
    <g>
      <path d="M694,168 C 748,172 792,150 786,110 C 782,84 756,74 744,92" fill="none" stroke="#0e1512" stroke-width="19" stroke-linecap="round" opacity="0.35"/>
      <path d="M694,168 C 748,172 792,150 786,110 C 782,84 756,74 744,92" fill="none" stroke="url(#tail)" stroke-width="15" stroke-linecap="round"/>
      <path d="M694,168 C 748,172 792,150 786,110 C 782,84 756,74 744,92" fill="none" stroke="#8fd8c8" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 20" opacity="0.45">
        <animate attributeName="stroke-dashoffset" values="0;-88" dur="4s" repeatCount="indefinite"/>
      </path>
      <circle cx="744" cy="92" r="7" fill="#cdeee5"/>
      <animateTransform attributeName="transform" type="rotate" values="-6 694 168;7 694 168;-6 694 168" keyTimes="0;0.5;1" dur="4.6s" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" repeatCount="indefinite"/>
    </g>

    <!-- cat head + face (gentle bob) -->
    <g>
      <path d="M566,70 L556,20 L598,52 Z" fill="#cdeee5" stroke="#0e1512" stroke-width="1.5"/>
      <path d="M568,60 L562,32 L586,50 Z" fill="#ff9db0" opacity="0.85"/>
      <g>
        <path d="M634,70 L644,20 L602,52 Z" fill="#cdeee5" stroke="#0e1512" stroke-width="1.5"/>
        <path d="M632,60 L638,32 L614,50 Z" fill="#ff9db0" opacity="0.85"/>
        <animateTransform attributeName="transform" type="rotate" values="0 634 66;-10 634 66;3 634 66;0 634 66;0 634 66" keyTimes="0;0.05;0.1;0.16;1" dur="5.5s" repeatCount="indefinite"/>
      </g>
      <ellipse cx="600" cy="94" rx="46" ry="40" fill="#cdeee5" stroke="#0e1512" stroke-width="1.5"/>
      <ellipse cx="584" cy="90" rx="7" ry="9.5" fill="#0e1512"><animate attributeName="ry" values="9.5;9.5;0.6;9.5;9.5" keyTimes="0;0.44;0.5;0.56;1" dur="4.2s" repeatCount="indefinite"/></ellipse>
      <ellipse cx="616" cy="90" rx="7" ry="9.5" fill="#0e1512"><animate attributeName="ry" values="9.5;9.5;0.6;9.5;9.5" keyTimes="0;0.44;0.5;0.56;1" dur="4.2s" repeatCount="indefinite"/></ellipse>
      <circle cx="585" cy="89" r="3" fill="#6ee7c7" filter="url(#glow)"><animate attributeName="opacity" values="1;1;0;1;1" keyTimes="0;0.44;0.5;0.56;1" dur="4.2s" repeatCount="indefinite"/></circle>
      <circle cx="617" cy="89" r="3" fill="#6ee7c7" filter="url(#glow)"><animate attributeName="opacity" values="1;1;0;1;1" keyTimes="0;0.44;0.5;0.56;1" dur="4.2s" repeatCount="indefinite"/></circle>
      <circle cx="586.5" cy="87" r="1.1" fill="#eafff8" opacity="0.85"/>
      <circle cx="618.5" cy="87" r="1.1" fill="#eafff8" opacity="0.85"/>
      <path d="M594,102 L606,102 L600,110 Z" fill="#ff9db0" stroke="#0e1512" stroke-width="0.8"/>
      <path d="M600,110 q -7,8 -13,3 M600,110 q 7,8 13,3" fill="none" stroke="#0e1512" stroke-width="1.4" stroke-linecap="round"/>
      <g stroke="#7fa99d" stroke-width="1" opacity="0.7" stroke-linecap="round">
        <line x1="572" y1="103" x2="532" y2="97"/>
        <line x1="572" y1="108" x2="530" y2="108"/>
        <line x1="572" y1="113" x2="532" y2="119"/>
        <line x1="628" y1="103" x2="668" y2="97"/>
        <line x1="628" y1="108" x2="670" y2="108"/>
        <line x1="628" y1="113" x2="668" y2="119"/>
      </g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" keyTimes="0;0.5;1" dur="3.6s" calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1" repeatCount="indefinite"/>
    </g>

    <!-- laptop screen -->
    <rect x="506" y="112" width="188" height="130" rx="10" fill="#15201c" stroke="#2dd4bf" stroke-width="2"/>
    <rect x="518" y="124" width="164" height="108" rx="4" fill="#0b1410"/>
    <g clip-path="url(#screenClip)">
      <g>
        <rect x="524" y="126" width="34" height="6" rx="2" fill="#8ea2ff"/>
        <rect x="538" y="139" width="96" height="6" rx="2" fill="#7fa99d"/>
        <rect x="538" y="152" width="70" height="6" rx="2" fill="#6ee7c7"/>
        <rect x="552" y="165" width="120" height="6" rx="2" fill="#7fa99d"/>
        <rect x="552" y="178" width="54" height="6" rx="2" fill="#ff9db0"/>
        <rect x="538" y="191" width="88" height="6" rx="2" fill="#6ee7c7"/>
        <rect x="524" y="204" width="44" height="6" rx="2" fill="#8ea2ff"/>
        <rect x="538" y="217" width="108" height="6" rx="2" fill="#7fa99d"/>
        <rect x="524" y="230" width="34" height="6" rx="2" fill="#8ea2ff"/>
        <rect x="538" y="243" width="96" height="6" rx="2" fill="#7fa99d"/>
        <rect x="538" y="256" width="70" height="6" rx="2" fill="#6ee7c7"/>
        <rect x="552" y="269" width="120" height="6" rx="2" fill="#7fa99d"/>
        <rect x="552" y="282" width="54" height="6" rx="2" fill="#ff9db0"/>
        <rect x="538" y="295" width="88" height="6" rx="2" fill="#6ee7c7"/>
        <rect x="524" y="308" width="44" height="6" rx="2" fill="#8ea2ff"/>
        <rect x="538" y="321" width="108" height="6" rx="2" fill="#7fa99d"/>
        <rect x="524" y="334" width="34" height="6" rx="2" fill="#8ea2ff"/>
        <rect x="538" y="347" width="96" height="6" rx="2" fill="#7fa99d"/>
        <rect x="538" y="360" width="70" height="6" rx="2" fill="#6ee7c7"/>
        <rect x="552" y="373" width="120" height="6" rx="2" fill="#7fa99d"/>
        <rect x="677" y="163" width="6" height="9" fill="#6ee7c7"><animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/></rect>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -104" dur="5s" calcMode="linear" repeatCount="indefinite"/>
      </g>
      <rect x="518" y="124" width="164" height="2" fill="#6ee7c7" opacity="0.1"><animate attributeName="y" values="124;230;124" dur="4.5s" repeatCount="indefinite"/></rect>
    </g>

    <!-- laptop base -->
    <rect x="502" y="240" width="196" height="6" rx="3" fill="#2dd4bf" opacity="0.55"/>
    <path d="M486,246 H714 L744,272 H456 Z" fill="#15201c" stroke="#2dd4bf" stroke-width="2"/>
    <path d="M498,250 H702 L724,268 H476 Z" fill="#101a16"/>
    <g stroke="#2b3a35" stroke-width="2" stroke-linecap="round" opacity="0.6">
      <line x1="508" y1="256" x2="692" y2="256"/>
      <line x1="504" y1="262" x2="696" y2="262"/>
    </g>
    <path d="M584,258 H636 L644,266 H576 Z" fill="#0b1410" stroke="#2b3a35" stroke-width="1"/>

    <!-- cat paws resting on the laptop (soft knead) -->
    <g fill="#cdeee5" stroke="#0e1512" stroke-width="1">
      <rect x="556" y="106" width="26" height="16" rx="8"/>
      <rect x="618" y="106" width="26" height="16" rx="8"/>
      <path d="M563,110 v8 M570,109 v9 M577,110 v8 M625,110 v8 M632,109 v9 M639,110 v8" stroke="#0e1512" stroke-width="1" fill="none"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 1.6;0 0" keyTimes="0;0.5;1" dur="2.8s" repeatCount="indefinite"/>
    </g>

    <!-- hot coffee, resting on the desk -->
    <g transform="translate(0,26)">
      <ellipse cx="770" cy="250" rx="30" ry="6" fill="#000000" opacity="0.28"/>
      <path d="M796,214 c 20,2 20,30 0,30" fill="none" stroke="#0e1512" stroke-width="9" stroke-linecap="round"/>
      <path d="M796,214 c 20,2 20,30 0,30" fill="none" stroke="#cdeee5" stroke-width="6" stroke-linecap="round"/>
      <path d="M744,204 h48 q6,0 6,6 v26 q0,12 -12,12 h-36 q-12,0 -12,-12 v-26 q0,-6 6,-6 z" fill="#dcefe9" stroke="#0e1512" stroke-width="1.5"/>
      <rect x="742" y="204" width="56" height="8" rx="3" fill="#2dd4bf"/>
      <ellipse cx="770" cy="208" rx="24" ry="5" fill="#2a1c14"/>
      <g transform="translate(760,0)"><g opacity="0"><path d="M0,198 c -8,-10 8,-18 0,-28 c -8,-10 8,-18 0,-28" fill="none" stroke="#bfe9df" stroke-width="3.5" stroke-linecap="round"/>
        <animate attributeName="opacity" values="0;0.5;0.5;0" dur="3.4s" begin="0s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 6;0 -26" dur="3.4s" begin="0s" repeatCount="indefinite"/></g></g>
      <g transform="translate(771,0)"><g opacity="0"><path d="M0,198 c -8,-10 8,-18 0,-28 c -8,-10 8,-18 0,-28" fill="none" stroke="#bfe9df" stroke-width="3.5" stroke-linecap="round"/>
        <animate attributeName="opacity" values="0;0.5;0.5;0" dur="3.4s" begin="1.1s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 6;0 -26" dur="3.4s" begin="1.1s" repeatCount="indefinite"/></g></g>
      <g transform="translate(782,0)"><g opacity="0"><path d="M0,198 c -8,-10 8,-18 0,-28 c -8,-10 8,-18 0,-28" fill="none" stroke="#bfe9df" stroke-width="3.5" stroke-linecap="round"/>
        <animate attributeName="opacity" values="0;0.5;0.5;0" dur="3.4s" begin="2.2s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 6;0 -26" dur="3.4s" begin="2.2s" repeatCount="indefinite"/></g></g>
    </g>

    <!-- left text panel -->
    <rect x="0" y="0" width="470" height="340" fill="url(#scrim)"/>
    <g font-family="'Segoe UI', Poppins, system-ui, sans-serif">
      <text x="44" y="86" font-size="12" letter-spacing="4" fill="#6ee7c7">HELLO &#8212; I'M</text>
      <text x="42" y="130" font-size="44" font-weight="800" fill="#eafff8">Anish Kuila</text>
      <text x="44" y="158" font-size="15" fill="#8ea2ff">Full-Stack SDE &#183; Enterprise Systems &#183; Cloud</text>
      <g font-family="'Fira Code', ui-monospace, monospace" font-size="12" fill="#a9c7c0">
        <rect x="44" y="184" width="9" height="9" rx="2" fill="#2dd4bf"/><text x="62" y="193">Boston, MA</text>
        <rect x="44" y="206" width="9" height="9" rx="2" fill="#8ea2ff"/><text x="62" y="215">MS Software Engineering Systems &#183; Northeastern</text>
        <rect x="44" y="228" width="9" height="9" rx="2" fill="#ff9db0"/><text x="62" y="237">Building Talon Vault &#8212; Asset &amp; Ops Mgmt</text>
      </g>
      <g font-family="'Fira Code', ui-monospace, monospace" font-size="12.5">
        <text x="44" y="276" fill="#7fa99d">~/anish <tspan fill="#6ee7c7">$</tspan> <tspan fill="#dcefe9">building things</tspan></text>
        <rect x="228" y="266" width="7" height="11" fill="#6ee7c7"><animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/></rect>
      </g>
    </g>
  </g>

  <rect x="1.5" y="1.5" width="997" height="337" rx="19" fill="none" stroke="#2b3a35" stroke-width="1.5"/>
</svg>
