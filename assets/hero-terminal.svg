<svg viewBox="0 0 1200 230" xmlns="http://www.w3.org/2000/svg" font-family="'Fira Code', 'JetBrains Mono', monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05130c"/>
      <stop offset="100%" stop-color="#0d2818"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0" x2="100%" y2="0">
      <stop offset="0%" stop-color="#0d2818"/>
      <stop offset="50%" stop-color="#39d97a"/>
      <stop offset="100%" stop-color="#0d2818"/>
      <animate attributeName="x1" values="-30%;100%;-30%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="70%;200%;70%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="230" rx="14" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="228" rx="13" fill="none" stroke="#1a8f4c" stroke-opacity="0.35"/>

  <!-- animated accent line, top edge -->
  <rect x="1" y="1" width="1198" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- body -->
  <g font-size="20">
    <text x="40" y="70" fill="#5fe38c">
      <tspan fill="#5fe38c">anish@systems</tspan><tspan fill="#e8f5ec">:~$ </tspan><tspan fill="#ffffff">whoami</tspan>
    </text>
    <text x="40" y="104" fill="#e8f5ec">&gt; Anish Kuila — Full-Stack SDE, MS Software Engineering Systems @ Northeastern</text>

    <text x="40" y="148" fill="#5fe38c">
      <tspan fill="#5fe38c">anish@systems</tspan><tspan fill="#e8f5ec">:~$ </tspan><tspan fill="#ffffff">cat focus.log</tspan>
    </text>
    <text x="40" y="182" fill="#9fe8b8">&gt; FastAPI · Spring Boot · React · Node — shipping RBAC systems, REST APIs, deployed web apps</text>

    <rect x="40" y="192" width="12" height="20" fill="#39d97a">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
