<svg viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg" font-family="'Fira Code', 'JetBrains Mono', monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05130c"/>
      <stop offset="100%" stop-color="#0d2818"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="220" rx="14" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="218" rx="13" fill="none" stroke="#1a8f4c" stroke-opacity="0.35"/>

  <!-- stat 1 -->
  <g transform="translate(150,110)">
    <circle r="46" fill="none" stroke="#123a24" stroke-width="7"/>
    <circle r="46" fill="none" stroke="#39d97a" stroke-width="7" stroke-linecap="round"
            stroke-dasharray="289" stroke-dashoffset="289" transform="rotate(-90)">
      <animate attributeName="stroke-dashoffset" from="289" to="0" dur="1.6s" fill="freeze"/>
    </circle>
    <text y="-2" text-anchor="middle" font-size="30" fill="#ffffff" font-weight="bold">66</text>
    <text y="20" text-anchor="middle" font-size="12" fill="#9fe8b8">REST endpoints</text>
    <text y="80" text-anchor="middle" font-size="11" fill="#7fbf98">Enterprise PLM</text>
  </g>

  <!-- stat 2 -->
  <g transform="translate(450,110)">
    <circle r="46" fill="none" stroke="#123a24" stroke-width="7"/>
    <circle r="46" fill="none" stroke="#39d97a" stroke-width="7" stroke-linecap="round"
            stroke-dasharray="289" stroke-dashoffset="289" transform="rotate(-90)">
      <animate attributeName="stroke-dashoffset" from="289" to="0" dur="1.6s" begin="0.15s" fill="freeze"/>
    </circle>
    <text y="-2" text-anchor="middle" font-size="30" fill="#ffffff" font-weight="bold">24</text>
    <text y="20" text-anchor="middle" font-size="12" fill="#9fe8b8">REST APIs</text>
    <text y="80" text-anchor="middle" font-size="11" fill="#7fbf98">RecipeHub</text>
  </g>

  <!-- stat 3 -->
  <g transform="translate(750,110)">
    <circle r="46" fill="none" stroke="#123a24" stroke-width="7"/>
    <circle r="46" fill="none" stroke="#39d97a" stroke-width="7" stroke-linecap="round"
            stroke-dasharray="289" stroke-dashoffset="289" transform="rotate(-90)">
      <animate attributeName="stroke-dashoffset" from="289" to="0" dur="1.6s" begin="0.3s" fill="freeze"/>
    </circle>
    <text y="-2" text-anchor="middle" font-size="24" fill="#ffffff" font-weight="bold">99.97%</text>
    <text y="20" text-anchor="middle" font-size="12" fill="#9fe8b8">CNN accuracy</text>
    <text y="80" text-anchor="middle" font-size="11" fill="#7fbf98">Face detection</text>
  </g>

  <!-- stat 4 -->
  <g transform="translate(1050,110)">
    <circle r="46" fill="none" stroke="#123a24" stroke-width="7"/>
    <circle r="46" fill="none" stroke="#39d97a" stroke-width="7" stroke-linecap="round"
            stroke-dasharray="289" stroke-dashoffset="289" transform="rotate(-90)">
      <animate attributeName="stroke-dashoffset" from="289" to="0" dur="1.6s" begin="0.45s" fill="freeze"/>
    </circle>
    <text y="-2" text-anchor="middle" font-size="30" fill="#ffffff" font-weight="bold">5</text>
    <text y="20" text-anchor="middle" font-size="12" fill="#9fe8b8">RBAC tiers</text>
    <text y="80" text-anchor="middle" font-size="11" fill="#7fbf98">Keycloak</text>
  </g>
</svg>
