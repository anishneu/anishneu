name: Update streak stats

on:
  schedule:
    - cron: "0 3 * * *"   # runs daily at 03:00 UTC
  push:
    paths:
      - ".github/workflows/streak-stats.yml"
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=anishneu&hide_border=true&background=15201C&ring=6EE7C7&fire=2DD4BF&currStreakNum=DCEFE9&sideNums=DCEFE9&currStreakLabel=6EE7C7&sideLabels=7FA99D&dates=7FA99D&stroke=2B3A35
          path: assets/streak-stats.svg

      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/streak-stats.svg
          git commit -m "Update streak stats" || exit 0
          git push

