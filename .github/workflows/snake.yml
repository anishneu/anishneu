name: Update contribution snake

on:
  schedule:
    - cron: "0 4 * * *"   # daily at 04:00 UTC
  push:
    paths:
      - ".github/workflows/snake.yml"
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate mint-nocturne snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: anishneu
          # custom palette instead of the default green/purple:
          # snake body = pink accent, cells ramp from card-bg up to mint
          outputs: |
            assets/mint-snake.svg?color_snake=#ff9db0&color_dots=#15201c,#123b30,#1f6e5c,#2dd4bf,#6ee7c7

      - name: Commit mint-snake.svg
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/mint-snake.svg
          git commit -m "Update contribution snake" || exit 0
          git push
